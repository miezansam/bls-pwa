services:
  postgres:
    image: postgres:16-alpine
    container_name: bls_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bls_pwa
      POSTGRES_USER: bls_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bls_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bls_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - bls_redis_data:/data

volumes:
  bls_pg_data:
  bls_redis_data: